apiVersion: apps/v1
kind: Deployment
metadata:
  name: devopsflow-staging
  namespace: staging
  labels:
    app: devopsflow-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devopsflow-staging
  template:
    metadata:
      labels:
        app: devopsflow-staging
    spec:
      containers:
        - name: devopsflow
          image: ghcr.io/funmibi-a/devopsflow:staging
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
