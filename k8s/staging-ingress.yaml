apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devopsflow-staging-ingress
  namespace: staging
spec:
  ingressClassName: nginx
  rules:
    - host: devopsflow-staging.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devopsflow-staging
                port:
                  number: 80
