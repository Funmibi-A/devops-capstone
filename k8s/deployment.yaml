
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devopsflow
  labels:
    app: devopsflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devopsflow
  template:
    metadata:
      labels:
        app: devopsflow
    spec:
      containers:
        - name: devopsflow
          image: ghcr.io/funmibi-a/devopsflow:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
