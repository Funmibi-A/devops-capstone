apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devopsflow-ingress
  namespace: default
spec:
  ingressClassName: nginx
  rules:
    - host: devopsflow.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devopsflow
                port:
                  number: 80
