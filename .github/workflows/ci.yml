
name: DevOpsFlow CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Lint, Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm run test -- --run

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Build application
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Check JavaScript bundle size
        run: npm run check:bundle
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build-and-test, deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      pages: write
      id-token: write

    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4



  docker-publish:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React application for Docker
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: |
            ghcr.io/funmibi-a/devopsflow:latest
            ghcr.io/funmibi-a/devopsflow:staging
            ghcr.io/funmibi-a/devopsflow:sha-${{ github.sha }}

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/funmibi-a/devopsflow:latest
          format: table
          exit-code: '1'
          vuln-type: os,library
          severity: HIGH,CRITICAL
          version: v0.76.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/funmibi-a/devopsflow:latest
          docker push ghcr.io/funmibi-a/devopsflow:staging
          docker push ghcr.io/funmibi-a/devopsflow:sha-${GITHUB_SHA}


  deploy-staging:
    name: Deploy to Staging (Minikube)
    runs-on: [self-hosted, Linux, X64]
    needs: docker-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: staging
      url: http://devopsflow-staging.local

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Minikube
        run: |
          kubectl apply -f k8s/staging-deployment.yaml
          kubectl rollout status deployment/devopsflow-staging -n staging --timeout=180s

      - name: Verify staging deployment
        run: |
          MINIKUBE_IP=$(minikube ip)
          curl --fail --silent --show-error \
            --retry 10 --retry-connrefused --retry-delay 5 \
            -H "Host: devopsflow-staging.local" \
            "http://${MINIKUBE_IP}/"
